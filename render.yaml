services:
  # Backend API
  - type: web
    name: vehicle-inspection-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vehicle-inspection-db
          property: connectionString
  
  # Frontend Static Site
  - type: web
    name: vi-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://vehicle-inspection-app-90rp.onrender.com/api
    
  # PostgreSQL Database
  - type: pserv
    name: vehicle-inspection-db
    region: oregon
    plan: free
    databaseName: vehicle_inspection
    databaseUser: vehicle_inspection_user
